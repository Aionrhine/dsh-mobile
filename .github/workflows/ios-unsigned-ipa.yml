name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Artifacts/**'
      - 'AppRelease/**'

jobs:
  build:
    # macos-26 池子小：实测 1.7.15 首跑两个 run 排队满 15 分钟未等到 runner，
    # 被 GitHub 原样取消（与本注释记录的作者历史现象一致）。macos-15 池子大；
    # 镜像最高 Xcode 26.3，当前代码（27.1 已被上游撤除）可在 26.3 SDK 下编译。
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i 'iphoneos' || true

      - name: 下载 Metal 工具链（Xcode 26 起需单独下载）
        run: |
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal 工具链下载失败，若构建阶段报 metal 缺失请检查此步"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: 安装 gomobile（Xcode 脚本阶段经 gradlew buildTsnetXcframework 现场产出 Tsnetgo.xcframework）
        run: |
          go version
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init || echo "::warning::gomobile init 失败（缺 NDK 时 iOS bind 通常仍可进行，bind 报错再处理）"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装 JDK 17（Gradle 构建 KMP framework 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK（shared 模块含 android 目标，Gradle 配置期需要）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::未找到 Android SDK，$SDK 不存在"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Apply text-selection patch
        run: python3 scripts/apply-text-selection.py && grep -n 'textSelection(.enabled)' DeepSeekHarnessMobile/Views/ConversationView.swift | head -5

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project DeepSeekHarnessMobile.xcodeproj -scheme DeepSeekHarnessMobile

      - name: Build Tsnetgo xcframework
        run: |
          set -o pipefail
          ./gradlew buildTsnetXcframework 2>&1 | tee /tmp/tsnetgo.log
          ls -d tsnetgo/build/tsnetgo/Tsnetgo.xcframework

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== build failed (exit $status), last diagnostics ==="
            grep -E 'error:|BUILD FAILED' /tmp/xcodebuild.log | head -40
            exit "$status"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DeepSeekHarnessMobile-unsigned.ipa Payload
          unzip -l DeepSeekHarnessMobile-unsigned.ipa | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessMobile-unsigned-ipa
          path: DeepSeekHarnessMobile-unsigned.ipa
          retention-days: 14