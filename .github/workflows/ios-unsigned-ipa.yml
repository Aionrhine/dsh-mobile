name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Artifacts/**'
      - 'AppRelease/**'

jobs:
  build:
    # 1.7.11 起代码使用 iOS 27.1 SDK 符号（toolbar 新 API 等），需要 macos-26
    # 镜像的默认 Xcode（27.x）；macos-15 的 Xcode 26.3 编不过。
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i 'iphoneos' || true

      - name: 下载 Metal 工具链（Xcode 26 起需单独下载）
        run: |
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal 工具链下载失败，若构建阶段报 metal 缺失请检查此步"

      - name: 安装 JDK 17（Gradle 构建 KMP framework 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK（shared 模块含 android 目标，Gradle 配置期需要）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::未找到 Android SDK，$SDK 不存在"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Apply text-selection patch
        run: python3 scripts/apply-text-selection.py && grep -n 'textSelection(.enabled)' DeepSeekHarnessMobile/Views/ConversationView.swift | head -5

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project DeepSeekHarnessMobile.xcodeproj -scheme DeepSeekHarnessMobile

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== build failed (exit $status), last diagnostics ==="
            grep -E 'error:|BUILD FAILED' /tmp/xcodebuild.log | head -40
            exit "$status"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DeepSeekHarnessMobile-unsigned.ipa Payload
          unzip -l DeepSeekHarnessMobile-unsigned.ipa | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessMobile-unsigned-ipa
          path: DeepSeekHarnessMobile-unsigned.ipa
          retention-days: 14