name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Artifacts/**'
      - 'AppRelease/**'

jobs:
  build:
    # macos-26 is the newest image and its pool is small: jobs sat in the queue
    # for the full 15 minutes and were cancelled without ever getting a runner.
    # macos-15 ships Xcode 26.x too (26.0.1 / 26.1.1 / 26.2 / 26.3), so select
    # one explicitly and build on the much larger pool.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          echo "--- installed Xcodes ---"
          ls -1 /Applications | grep -i '^xcode' || true
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i 'iphoneos' || true

      - name: Apply text-selection patch
        run: python3 scripts/apply-text-selection.py && grep -n 'textSelection(.enabled)' DeepSeekHarnessMobile/Views/ConversationView.swift | head -5

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project DeepSeekHarnessMobile.xcodeproj -scheme DeepSeekHarnessMobile

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== build failed (exit $status), last diagnostics ==="
            grep -E 'error:|BUILD FAILED' /tmp/xcodebuild.log | head -40
            exit "$status"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DeepSeekHarnessMobile-unsigned.ipa Payload
          unzip -l DeepSeekHarnessMobile-unsigned.ipa | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessMobile-unsigned-ipa
          path: DeepSeekHarnessMobile-unsigned.ipa
          retention-days: 14