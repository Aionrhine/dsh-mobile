name: Build iOS 16.1 IPA (TrollStore)

# 产物：未上传 App Store、ad-hoc 签名的 .ipa，供 TrollStore 2 安装（iOS 14.0–16.6.1）。
# 触发方式：Actions 页面手动 Run workflow，或推送到 main / ios-16.1 分支。

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID（留空则用 config/Debug.xcconfig 里的默认值）"
        required: false
        default: ""
  push:
    branches: [main, ios-16.1]

env:
  PROJECT: DeepSeekHarnessMobile.xcodeproj
  SCHEME: DeepSeekHarnessMobile

jobs:
  build:
    # Xcode 26 只在 macos-26（或 macos-15 上的 Xcode 26 镜像）可用
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: 检出代码（含 Vendor 子模块目录）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 确认 Xcode 版本
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          # Xcode 26 支持的最低部署目标为 iOS 15，16.1 在允许范围内
          xcodebuild -list -project "$PROJECT"

      - name: 下载 Metal 工具链（Xcode 26 起需单独下载）
        run: |
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal 工具链下载失败，若构建阶段报 metal 缺失请检查此步"

      - name: 安装 JDK 17（Gradle 构建 KMP framework 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK（shared 模块含 android 目标，Gradle 配置期需要）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::未找到 Android SDK，$SDK 不存在"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" 2>/dev/null || true

      - name: 预构建 KMP framework（release/iosArm64）
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: 归档 App（关闭代码签名）
        run: |
          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DshMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            LOCAL_DEVELOPMENT_TEAM="" \
            ${BUNDLE_ID:+LOCAL_BUNDLE_IDENTIFIER="$BUNDLE_ID"} \
            -quiet

      - name: 组装 Payload 并 ad-hoc 签名
        run: |
          set -euo pipefail
          APP="build/DshMobile.xcarchive/Products/Applications/DshMobile.app"
          test -d "$APP" || { echo "::error::未找到 $APP"; ls -R build/DshMobile.xcarchive/Products | head -50; exit 1; }

          rm -rf build/Payload build/*.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          brew install ldid >/dev/null 2>&1 || true
          command -v ldid >/dev/null || { echo "::error::ldid 不可用"; exit 1; }

          # 先签扩展，再签主可执行文件，最后签整包（顺序不能反）
          for appex in "build/Payload/DshMobile.app"/PlugIns/*.appex; do
            [ -e "$appex" ] || continue
            EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")
            echo "sign extension: $appex/$EXEC"
            ldid -S "$appex/$EXEC"
            ldid -S "$appex"
          done

          # 内嵌的动态库（当前工程为静态 framework，通常为空）
          find "build/Payload/DshMobile.app/Frameworks" -name "*.dylib" -o -name "*.framework" 2>/dev/null | while read -r item; do
            case "$item" in
              *.framework) NAME=$(basename "$item" .framework); ldid -S "$item/$NAME" || true ;;
              *.dylib) ldid -S "$item" || true ;;
            esac
          done

          ldid -S "build/Payload/DshMobile.app/DshMobile"
          ldid -S "build/Payload/DshMobile.app"

          cd build
          zip -qry "Whaleness-iOS16.1-trollstore.ipa" Payload
          cd ..
          ls -lh build/*.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: Whaleness-iOS16.1-trollstore
          path: build/Whaleness-iOS16.1-trollstore.ipa
          if-no-files-found: error

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/DshMobile.xcarchive
            ~/Library/Logs/gradle
          if-no-files-found: ignore
          retention-days: 3
