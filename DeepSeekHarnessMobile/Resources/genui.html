<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font: 16px/1.55 -apple-system, system-ui, "PingFang SC", sans-serif; }
  #root { padding: 1px 2px 3px 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="standalone-runtime.js"></script>
<script>
  var currentUnmount = null;
  var loadedAssets = Object.create(null);
  var pendingAssets = Object.create(null);
  var lastReportedHeight = 0;

  function reportHeight() {
    var root = document.getElementById('root');
    if (!root) { return; }
    // Measure #root instead of documentElement/body so collapsing cards can
    // shrink back down instead of staying pinned to the previous WebView height.
    var rectHeight = root.getBoundingClientRect().height || 0;
    var scrollHeight = root.scrollHeight || 0;
    var height = Math.ceil(Math.max(rectHeight, scrollHeight));
    if (!height || height === lastReportedHeight) { return; }
    lastReportedHeight = height;
    var handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.genuiHeight;
    if (handler) { handler.postMessage(height); }
  }

  function applyFontScale(artifact) {
    var raw = artifact && artifact.presentation && artifact.presentation.fontScale;
    var scale = (typeof raw === 'number' && isFinite(raw)) ? Math.min(2.0, Math.max(0.7, raw)) : 1.0;
    if (document.body) {
      document.body.style.fontSize = (16 * scale).toFixed(2) + 'px';
    }
  }

  // Engine bundles register themselves on window.__GenuiAssets__, and the
  // standalone runtime only reads engines that are already there, so they have
  // to be injected before the mount call. Deduplicate across in-place remounts.
  window.__loadGenuiAssets = function (names) {
    var queue = (names || []).filter(function (name) { return !!name && !loadedAssets[name]; });
    if (queue.length === 0) { return Promise.resolve(); }
    return Promise.all(queue.map(function (name) {
      if (pendingAssets[name]) { return pendingAssets[name]; }
      var promise = new Promise(function (resolve) {
        var script = document.createElement('script');
        script.src = name + '.js';
        script.async = false;
        script.onload = function () {
          loadedAssets[name] = true;
          delete pendingAssets[name];
          resolve();
        };
        script.onerror = function () {
          delete pendingAssets[name];
          resolve();
        };
        document.head.appendChild(script);
      });
      pendingAssets[name] = promise;
      return promise;
    })).then(function () {});
  };

  // A silent blank box is worse than the raw fence, so every failure path
  // reports upward and the SwiftUI side swaps in the source text.
  function postFailure(message) {
    var handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.genuiFailure;
    if (!handler) { return; }
    var text = String(message || '');
    if (!text) { text = 'unknown error'; }
    handler.postMessage(text.slice(0, 300));
  }

  window.__mountGenui = function (artifact) {
    if (!window.__GenuiStandalone__ || typeof window.__GenuiStandalone__.mount !== 'function') {
      postFailure('standalone runtime missing');
      return 'standalone runtime missing';
    }
    var root = document.getElementById('root');
    if (typeof currentUnmount === 'function') {
      try { currentUnmount(); } catch (_) {}
      currentUnmount = null;
    }
    if (root) { root.innerHTML = ''; }
    lastReportedHeight = 0;
    applyFontScale(artifact);
    try {
      var cleanup = window.__GenuiStandalone__.mount(root, artifact);
      if (typeof cleanup === 'function') { currentUnmount = cleanup; }
    } catch (error) {
      var message = String(error && error.message ? error.message : error);
      postFailure(message);
      return message;
    }
    reportHeight();
    setTimeout(reportHeight, 120);
    setTimeout(reportHeight, 480);
    return null;
  };

  window.__mountGenuiWithAssets = function (artifact, names) {
    return window.__loadGenuiAssets(names).then(function () {
      return window.__mountGenui(artifact);
    }).catch(function (error) {
      postFailure(error && error.message ? error.message : error);
    });
  };

  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.getElementById('root'));
  }
</script>
</body>
</html>
